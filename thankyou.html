<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Thank You!</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: #b30101;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #333;
    }

    .thankyou-container {
      background: #fff;
      padding: 40px 30px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      max-width: 500px;
      width: 90%;
    }

    .checkmark {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
    }

    .checkmark circle {
      stroke: #4caf50;
      stroke-width: 6;
      fill: none;
      stroke-dasharray: 166;
      stroke-dashoffset: 166;
      animation: dash 0.6s ease-out forwards;
    }

    .checkmark path {
      stroke: #4caf50;
      stroke-width: 6;
      fill: none;
      stroke-dasharray: 48;
      stroke-dashoffset: 48;
      animation: dash-check 0.4s 0.6s ease-out forwards;
    }

    @keyframes dash {
      to { stroke-dashoffset: 0; }
    }

    @keyframes dash-check {
      to { stroke-dashoffset: 0; }
    }

    h1 {
      font-size: 28px;
      color: #222;
      margin-bottom: 10px;
    }

    p {
      font-size: 16px;
      color: #555;
      margin-bottom: 20px;
    }

    .download-link {
      display: inline-block;
      margin-top: 15px;
      color: #007bff;
      text-decoration: underline;
    }

    .redirect-note {
      font-size: 14px;
      color: #777;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="thankyou-container">
    <svg class="checkmark" viewBox="0 0 52 52">
      <circle cx="26" cy="26" r="25" />
      <path d="M14 27l7 7 17-17" />
    </svg>

    <h1>Thank You!</h1>
    <p>Your query has been submitted successfully.</p>
    <p>Your brochure will begin downloading shortly.</p>
    <a href="files/shakti-servo-transformers.pdf" download class="download-link">Click here if it doesn’t start</a>
    <p class="redirect-note">You’ll be redirected to the homepage in 20 seconds.</p>
  </div>

  <script>
    // Auto-download PDF
    window.onload = function () {
      const link = document.createElement("a");
      link.href = "files/shakti-servo-transformers.pdf";
      link.download = "Shakti-Servo-brochure.pdf";
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);

      // Redirect after 20 seconds
      setTimeout(() => {
        window.location.href = "index.html"; // Change to your actual homepage path
      }, 10000);
    };
  </script>
</body>
</html>
